name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Test build version (does not publish a Release)'
        required: true
        default: v0.0.0-test

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go packages
        run: go test -tags native ./...
      - name: Package and verify Universal app
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: bash build/darwin/release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: bin/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets
      - name: Verify downloaded archive
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          {
            printf '## 本次更新\n\n'
            if [[ -n "$previous_tag" ]]; then
              git log --reverse --no-merges --format='- %s (`%h`)' "$previous_tag..$RELEASE_TAG"
            else
              git log --reverse --no-merges --format='- %s (`%h`)' "$RELEASE_TAG"
            fi
            printf '\n\n## 下载与安装\n\n'
            printf '%s\n' 'macOS 13+ · Apple Silicon / Intel Universal。下载 DMG 并将 iDeploy 拖入 Applications。ZIP 同时提供给应用内 Sparkle 更新器使用。本版本仅使用 ad-hoc 临时签名，没有 Apple Developer ID 签名或公证，macOS 可能阻止首次启动；请仅在确认来源和 SHA256 后按系统安全提示处理，不要关闭系统全局安全保护。需要本机安装 Docker、Git 和 SSH。'
          } > release-notes.md
      - name: Create Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "iDeploy $RELEASE_TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"
