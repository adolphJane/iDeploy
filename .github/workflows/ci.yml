name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Test Go packages
        run: go test ./...
      - name: Build native macOS application
        run: bash build/darwin/build-native.sh build
