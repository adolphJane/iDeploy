version: '3'

tasks:
  build:
    platforms: [darwin]
    cmds:
      - bash build/darwin/build-native.sh build

  package:
    platforms: [darwin]
    cmds:
      - bash build/darwin/build-native.sh package

  universal:
    platforms: [darwin]
    cmds:
      - bash build/darwin/build-native.sh universal

  run:
    platforms: [darwin]
    cmds:
      - task: package
      - open bin/iDeploy.app

  dev:
    platforms: [darwin]
    cmds:
      - task: run
